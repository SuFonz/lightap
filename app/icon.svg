<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- userSpaceOnUse：羽轴的描边也用同一坐标系，
         镂空处透出的渐变与背景完全连续，不会出现色差接缝 -->
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fbaf5"/>
      <stop offset="1" stop-color="#3f8fd4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#g)"/>
  <!-- 羽片 -->
  <path fill="#ffffff" d="M25 6.8 C 14.4 8.8 8 15.4 6.8 25.6 C 17.2 23.6 23.2 17.4 25 6.8 Z"/>
  <!-- 羽轴：用背景渐变描边形成镂空 -->
  <path stroke="url(#g)" stroke-width="1.9" stroke-linecap="round" d="M23 8.8 L 9.4 22.4"/>
  <!-- 羽茎：伸出羽片外，圆头收尾 -->
  <path stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" d="M8.6 23.2 L 4.6 27.2"/>
</svg>
